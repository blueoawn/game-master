<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Games - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background: #c53030;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(229, 62, 62, 0.3);
        }

        .btn-warning {
            background: #ed8936;
            color: white;
        }

        .btn-warning:hover {
            background: #dd6b20;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(237, 137, 54, 0.3);
        }

        .leaderboard-panel {
            grid-column: 1 / -1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f7fafc;
        }

        .rank {
            font-weight: bold;
            color: #667eea;
        }

        .medal {
            font-size: 18px;
            margin-right: 5px;
        }

        .message {
            padding: 12px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #48bb78;
        }

        .message.error {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #e53e3e;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            background: #f7fafc;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Chat Games Admin Panel</h1>
            <div class="subtitle">Manage leaderboard scores and player data</div>
        </header>

        <div id="message" class="message"></div>

        <div class="panel-grid">
            <div class="panel">
                <h2>Reset Player Score</h2>
                <div class="input-group">
                    <label for="resetUsername">Username</label>
                    <input type="text" id="resetUsername" placeholder="Enter username">
                </div>
                <button class="btn-warning" onclick="resetPlayerScore()">Reset Player</button>
            </div>

            <div class="panel">
                <h2>Set Player Score</h2>
                <div class="input-group">
                    <label for="setUsername">Username</label>
                    <input type="text" id="setUsername" placeholder="Enter username">
                </div>
                <div class="input-group">
                    <label for="setScore">New Score</label>
                    <input type="number" id="setScore" placeholder="Enter score" value="0">
                </div>
                <button class="btn-primary" onclick="setPlayerScore()">Set Score</button>
            </div>

            <div class="panel">
                <h2>Clear All Scores</h2>
                <p style="color: #e53e3e; margin-bottom: 15px; font-size: 14px;">
                    Warning: This will delete all player scores permanently!
                </p>
                <button class="btn-danger" onclick="confirmClearAll()">Clear All Scores</button>
            </div>

            <div class="panel leaderboard-panel">
                <h2>Current Leaderboard</h2>
                <div class="stats">
                    <div class="stat-box">
                        <div class="stat-value" id="totalPlayers">0</div>
                        <div class="stat-label">Total Players</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalScore">0</div>
                        <div class="stat-label">Total Score</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="highestScore">0</div>
                        <div class="stat-label">Highest Score</div>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Username</th>
                            <th>Score</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #999;">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Use CDN version to avoid server-side Socket.IO client serving issues -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"
            integrity="sha384-/KNQL8Nu5gCHLqwqfQjA689Hhoqgi2S84SNUxC3roTe4EhJ9AfLkp8QiQcU8AMzI"
            crossorigin="anonymous"></script>
    <script>
        console.log('🔧 Admin panel initializing...');

        // Test health endpoint first
        fetch('/api/admin/health')
            .then(res => res.json())
            .then(data => {
                console.log('📊 Health check:', data);
                if (!data.success) {
                    showMessage(`Database error: ${data.error}`, 'error');
                } else if (!data.database.table_exists) {
                    showMessage('Warning: player_scores table does not exist. Start the Twitch bot to create it.', 'error');
                }
            })
            .catch(err => console.error('Health check failed:', err));

        const socket = io();

        // Socket connection debugging
        socket.on('connect', () => {
            console.log('✅ Connected to server');
            console.log('   Socket ID:', socket.id);
            socket.emit('join', { room: 'main_room' });
            loadLeaderboard();
        });

        socket.on('connect_error', (error) => {
            console.error('❌ Socket connection error:', error);
            showMessage('Failed to connect to server: ' + error.message, 'error');
        });

        socket.on('disconnect', (reason) => {
            console.warn('⚠️ Disconnected from server:', reason);
        });

        // Listen for leaderboard updates
        socket.on('leaderboard_update', (data) => {
            console.log('📊 Received leaderboard update:', data);
            updateLeaderboardDisplay(data.leaderboard, data.stats);
        });

        // Listen for admin action responses
        socket.on('admin_action_response', (data) => {
            showMessage(data.message, data.success ? 'success' : 'error');
            if (data.success) {
                loadLeaderboard();
            }
        });

        function loadLeaderboard() {
            console.log('📡 Requesting leaderboard from server...');
            socket.emit('get_leaderboard_admin');
        }

        function updateLeaderboardDisplay(leaderboard, stats) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (leaderboard.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">No scores yet</td></tr>';
                return;
            }

            leaderboard.forEach((player, index) => {
                const row = document.createElement('tr');
                const rank = index + 1;
                let medal = '';

                if (rank === 1) medal = '🥇 ';
                else if (rank === 2) medal = '🥈 ';
                else if (rank === 3) medal = '🥉 ';

                row.innerHTML = `
                    <td class="rank">${medal}${rank}</td>
                    <td>${player.username}</td>
                    <td>${player.score}</td>
                    <td>${player.last_updated || 'N/A'}</td>
                `;
                tbody.appendChild(row);
            });

            // Update stats
            if (stats) {
                document.getElementById('totalPlayers').textContent = stats.total_players || 0;
                document.getElementById('totalScore').textContent = stats.total_score || 0;
                document.getElementById('highestScore').textContent = stats.highest_score || 0;
            }
        }

        function resetPlayerScore() {
            const username = document.getElementById('resetUsername').value.trim();

            if (!username) {
                showMessage('Please enter a username', 'error');
                return;
            }

            if (confirm(`Are you sure you want to reset ${username}'s score to 0?`)) {
                socket.emit('admin_reset_player', { username });
                document.getElementById('resetUsername').value = '';
            }
        }

        function setPlayerScore() {
            const username = document.getElementById('setUsername').value.trim();
            const score = parseInt(document.getElementById('setScore').value);

            if (!username) {
                showMessage('Please enter a username', 'error');
                return;
            }

            if (isNaN(score) || score < 0) {
                showMessage('Please enter a valid score (0 or greater)', 'error');
                return;
            }

            socket.emit('admin_set_score', { username, score });
            document.getElementById('setUsername').value = '';
            document.getElementById('setScore').value = '0';
        }

        function confirmClearAll() {
            const confirmation = prompt('This will delete ALL scores! Type "DELETE ALL" to confirm:');

            if (confirmation === 'DELETE ALL') {
                socket.emit('admin_clear_all');
            } else if (confirmation !== null) {
                showMessage('Confirmation text did not match. Action cancelled.', 'error');
            }
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
